x-app-env: &app-env
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgres://postgres:postgres@database:5432/enko
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: minio
  S3_PORT: 9000
  S3_USE_SSL: "false"
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: exports
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost}
  S3_PUBLIC_PORT: ${S3_PUBLIC_PORT:-9000}
  PDF_CHUNK_SIZE: ${PDF_CHUNK_SIZE:-500}
  PDF_WORKER_CONCURRENCY: ${PDF_WORKER_CONCURRENCY:-1}
  PDF_BATCH_SIZE: ${PDF_BATCH_SIZE:-500}
  IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-4}
  IMAGE_TIMEOUT_MS: ${IMAGE_TIMEOUT_MS:-10000}
  IMAGE_MAX_SIZE_MB: ${IMAGE_MAX_SIZE_MB:-5}
  IMAGE_RETRY: ${IMAGE_RETRY:-2}
  MAX_RETRIES: ${MAX_RETRIES:-3}
  EXPORT_TTL_HOURS: ${EXPORT_TTL_HOURS:-24}
  DEMO_IMAGE_BASE_URL: ${DEMO_IMAGE_BASE_URL:-http://backend:3000}
  TMP_DIR: /tmp/pdf-export

services:
  backend:
    build: .
    command: node src/server.js
    environment:
      <<: *app-env
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-1.0}"
          memory: "${BACKEND_MEM_LIMIT:-512M}"

  worker:
    build: .
    command: node src/worker.js
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-1.0}"
          memory: "${WORKER_MEM_LIMIT:-1G}"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    ports:
      - "6379:6379"

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enko
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enko"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  redis-data:
  pg-data:
  minio-data:
